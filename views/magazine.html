<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ars For Nons - Magazine</title>
    <style>
        * {
            background-color: #222222;
        }

        .highlighted {
            color: white;
        }

        .stats {
            color: white;
        }

        .statsLabel {
            color: white;
            text-underline: dash-long white;
        }

        .contribution {
            color: white;
            width: 80%;
            height: 80%;
            margin-left: 10%;
            margin-right: 10%;

            font-size: 40px;
            text-align: justify;
            word-wrap: break-word;
            white-space: pre-wrap;
            word-break: break-word
        }

        .cont-button {
            color: white;
            width: 20%;
            height: 10%;
            margin: 20px;
            padding: 10px;

            font-size: 30px;
        }

        .row {
            display: inline-block;
            margin: 15px 5%;
            align-content: center;
        }

    </style>
</head>
<body>
    <button class="cont-button" onclick="getText(0)"> Text 0</button>
    <button class="cont-button" onclick="getText(1)"> Text 1</button>
    <button class="cont-button" onclick="getText(2)"> Text 2</button>
    <button class="cont-button" onclick="getText(3)"> Text 3</button>
    <button class="cont-button" onclick="getText(4)"> Text 4</button>

    <pre id="contribution" class="contribution"></pre>

    <script>
        const decoder = new TextDecoder();
        const contribution = document.getElementById("contribution");
        const loadingMsg = "Loading text";
        let loadingCounter = 0;
        let isLoading = false;

        function simpleLoading() {
            if (isLoading) {
                loadingCounter++;
                if (loadingCounter > 3) loadingCounter = 0;

                let dots = "";
                for (let i = 0; i < loadingCounter; i++) dots += ".";
                contribution.innerText = loadingMsg + dots;
            }
            else loadingCounter = 0;
        }
        setInterval(simpleLoading, 1000);

        function getText(index) {
            isLoading = true;
            fetch("/magazine-text?id=" + index, {
                mode: "cors",
            })
            .then((r) => {
                isLoading = false;
                if (r.ok) {
                    const reader = r.body.getReader();
                    reader.read().then((result) => {
                        const obj = JSON.parse(decoder.decode(result.value || new Uint8Array(result.value.length), {
                            stream: !result.done,
                        }));
                        contribution.innerText = obj.data;
                    });
                }
                else {
                    contribution.innerText = "ERROR #" + r.status + ": " + r.statusText + "!\n" +
                        "Please try again or contact us.";
                }
            });
        }
    </script>
</body>
</html>
