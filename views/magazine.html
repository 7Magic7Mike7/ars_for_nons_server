    <pre id="contribution" class="contribution"></pre>

    <script>
        const decoder = new TextDecoder();
        const contribution = document.getElementById("contribution");
        const loadingMsg = "Loading text";
        let loadingCounter = 0;
        let isLoading = false;

            fetch("/magazine-text", {
                mode: "cors",
            })
            .then((r) => {
                isLoading = false;
                if (r.ok) {
                    const reader = r.body.getReader();
                    reader.read().then((result) => {
                        try {
                            console.log(result);
                        }
                        catch (e) {
                            console.log(e);
                        }
                    });
                }
                else {
                    contribution.innerText = "ERROR #" + r.status + ": " + r.statusText + "!\n" +
                        "Please try again or contact us.";
                }
            });
        }

        function simpleLoading() {
            if (isLoading) {
                loadingCounter++;
                if (loadingCounter > 3) loadingCounter = 0;

                let dots = "";
                for (let i = 0; i < loadingCounter; i++) dots += ".";
                contribution.innerText = loadingMsg + dots;
            }
            else loadingCounter = 0;
        }
        setInterval(simpleLoading, 1000);

        function getText(index) {
            isLoading = true;
            fetch("/magazine-text?id=" + index, {
                mode: "cors",
            })
            .then((r) => {
                isLoading = false;
                if (r.ok) {
                    const reader = r.body.getReader();
                    reader.read().then((result) => {
                        try {
                            const decoded = decoder.decode(result.value || new Uint8Array(result.value.length), {
                                stream: !result.done,
                            })
                            console.log(decoded);
                            const obj = JSON.parse(decoded);
                            contribution.innerText = obj.data;
                        }
                        catch (e) {
                            console.log(e);
                        }
                    });
                }
                else {
                    contribution.innerText = "ERROR #" + r.status + ": " + r.statusText + "!\n" +
                        "Please try again or contact us.";
                }
            });
        }
    </script>
